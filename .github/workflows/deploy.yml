name: Build & Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Push build to deploy branch
        run: |
          cat > out/.cpanel.yml << 'EOF'
          ---
          deployment:
            tasks:
              - export DEPLOYPATH=/home/$USER/public_html/
              - /bin/rsync -av --delete --exclude='.cpanel.yml' --exclude='.git' . $DEPLOYPATH
          EOF

          cd out
          git init
          git config user.email "ci@pmax.online"
          git config user.name "pmax CI"
          git add -A
          git commit -m "Deploy $(date -u '+%Y-%m-%d %H:%M') UTC"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/tikitakadigital/pmax.git
          git push --force origin HEAD:deploy
