name: Build & Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inject deploy secret into webhook script
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: sed -i "s/%%DEPLOY_SECRET%%/${DEPLOY_SECRET}/" out/_deploy.php

      - name: Bootstrap webhook on server via Fileman API
        run: |
          RESP=$(curl -sS -X POST \
            -H "Authorization: cpanel pmax:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://rs00011.dp.smartservers.com.au:2083/execute/Fileman/save_file_content" \
            --data-urlencode "dir=/home1/pmax/public_html" \
            --data-urlencode "file=_deploy.php" \
            --data-urlencode "content@out/_deploy.php" \
            -d "charset=utf-8")
          echo "Fileman write: $RESP"

      - name: Package and deploy via PHP webhook
        run: |
          cd out && zip -r /tmp/deploy.zip .
          RESP=$(curl -sS -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/deploy.zip \
            --max-time 180 \
            https://pmax.online/_deploy.php)
          echo "Deploy response: $RESP"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://pmax.online)
          echo "Site status: $HTTP"
