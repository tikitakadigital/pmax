name: Build & Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Blocks the deploy on broken hreflang. These errors are invisible in a
      # browser and usually only show up in Search Console weeks later, so the
      # export is checked as a whole — reciprocity cannot be verified one page
      # at a time.
      - name: Check hreflang
        run: npm run check:hreflang

      - name: Inject deploy secret into webhook script
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: sed -i "s/%%DEPLOY_SECRET%%/${DEPLOY_SECRET}/" out/_deploy.php

      - name: Package and deploy via PHP webhook
        run: |
          TS=$(date +%s)
          ZIP_FILE="deploy_${TS}.zip"

          # Zip in subshell so working dir stays at workspace root
          (cd out && zip -r /tmp/${ZIP_FILE} .)

          # Upload ZIP with unique timestamped name (no conflict with old files)
          UPLOAD=$(curl -sS -X POST \
            -H "Authorization: cpanel pmax:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://rs00011.dp.smartservers.com.au:2083/execute/Fileman/upload_files" \
            -F "dir=/home1/pmax" \
            -F "file-1=@/tmp/${ZIP_FILE};filename=${ZIP_FILE}")
          echo "Upload: $UPLOAD"

          # Bootstrap .htaccess so Apache can serve requests (may be 600 from bad extraction)
          BOOT_HT=$(curl -sS -X POST \
            -H "Authorization: cpanel pmax:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://rs00011.dp.smartservers.com.au:2083/execute/Fileman/save_file_content" \
            --data-urlencode "dir=/home1/pmax/public_html" \
            --data-urlencode "file=.htaccess" \
            --data-urlencode "content@out/.htaccess" \
            -d "charset=utf-8")
          echo "Bootstrap .htaccess: $BOOT_HT"

          # Bootstrap new _deploy.php via Fileman before triggering
          BOOT=$(curl -sS -X POST \
            -H "Authorization: cpanel pmax:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://rs00011.dp.smartservers.com.au:2083/execute/Fileman/save_file_content" \
            --data-urlencode "dir=/home1/pmax/public_html" \
            --data-urlencode "file=_deploy.php" \
            --data-urlencode "content@out/_deploy.php" \
            -d "charset=utf-8")
          echo "Bootstrap _deploy.php: $BOOT"

          # Trigger webhook — PHP reads ZIP by name, extracts, fixes perms, cleans up
          RESP=$(curl -sS \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            -H "X-Deploy-File: ${ZIP_FILE}" \
            --max-time 180 \
            https://pmax.online/_deploy.php)
          echo "Deploy: $RESP"

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://pmax.online)
          echo "Site: $HTTP"

          # Purge Cloudflare cache after successful deploy
          if [ "$HTTP" = "200" ]; then
            CF_PURGE=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            echo "Cloudflare purge: $CF_PURGE"
          fi

          # Ping IndexNow with all URLs from sitemap after successful deploy
          if [ "$HTTP" = "200" ]; then
            URLS=$(python3 -c "import xml.etree.ElementTree as ET,json; root=ET.parse('out/sitemap.xml').getroot(); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}; urls=[u.find('s:loc',ns).text for u in root.findall('s:url',ns) if u.find('s:loc',ns) is not None]; print(json.dumps(urls))")
            echo "Submitting $(echo $URLS | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))') URLs to IndexNow"
            INDEXNOW=$(curl -sS -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "{\"host\":\"pmax.online\",\"key\":\"6ab900b2025b4f21f5ba12b499b55955\",\"keyLocation\":\"https://pmax.online/6ab900b2025b4f21f5ba12b499b55955.txt\",\"urlList\":${URLS}}")
            echo "IndexNow: $INDEXNOW"
          fi
