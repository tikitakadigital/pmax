name: Build & Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Push build to deploy branch
        run: |
          printf '%s\n' \
            'deployment:' \
            '  tasks:' \
            '    - /bin/rsync -a --delete --exclude=.cpanel.yml --exclude=.git . /home1/pmax/public_html/' \
            '    - /bin/chmod -R a+rX /home1/pmax/public_html' \
            > out/.cpanel.yml

          BUILD_DIR="$(pwd)/out"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/tikitakadigital/pmax.git"

          mkdir /tmp/deploy_work && cd /tmp/deploy_work
          git init
          git config user.email "ci@pmax.online"
          git config user.name "pmax CI"
          git remote add origin "$REPO_URL"

          # Fetch existing deploy branch to preserve history (enables fast-forward in cPanel)
          git fetch origin deploy 2>/dev/null || true

          if git show-ref --verify --quiet refs/remotes/origin/deploy; then
            git checkout -b deploy origin/deploy
            git rm -rf . --quiet
          else
            git checkout -b deploy
          fi

          cp -a "$BUILD_DIR/." .
          git add -A
          git diff --staged --quiet || git commit -m "Deploy $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push origin deploy

      - name: Trigger cPanel deployment
        run: |
          # Add a temporary cron to fix public_html permissions after rsync resets them to 700
          CRON_CMD="/bin/chmod 755 /home1/pmax/public_html"
          ADD_CRON=$(curl -sS -X POST \
            -H "Authorization: cpanel pmax:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://rs00011.dp.smartservers.com.au:2083/execute/Cron/add_line" \
            -d "command=${CRON_CMD}&minute=*&hour=*&day=*&month=*&weekday=*")
          echo "Add cron response: $ADD_CRON"

          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: cpanel pmax:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://rs00011.dp.smartservers.com.au:2083/execute/VersionControlDeployment/create" \
            -d 'repository_root=/home1/pmax/repositories/pmax')
          echo "cPanel API response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":1' && echo "Deployment triggered successfully" || echo "WARNING: unexpected response"

          echo "Waiting 90s for deployment + cron to run..."
          sleep 90

          # Remove the temporary cron
          RM_CRON=$(curl -sS -X POST \
            -H "Authorization: cpanel pmax:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://rs00011.dp.smartservers.com.au:2083/execute/Cron/remove_line" \
            -d "command=${CRON_CMD}&minute=*&hour=*&day=*&month=*&weekday=*")
          echo "Remove cron response: $RM_CRON"

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://pmax.online)
          echo "Site HTTP status after deploy: $HTTP"
