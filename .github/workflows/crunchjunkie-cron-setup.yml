name: Setup crunchjunkie log cron on cPanel

# Run this ONCE manually from the Actions tab.
# It installs a daily cron job directly on the cPanel server.
# After that, GitHub is out of the loop — the server uploads logs itself.
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install cPanel cron for daily crunchjunkie log upload
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CJ_LOG_URL: ${{ secrets.CRUNCHJUNKIE_LOG_URL }}
        run: |
          CPANEL="https://rs00011.dp.smartservers.com.au:2083"
          AUTH="cpanel pmax:${CPANEL_API_TOKEN}"

          # ── 1. Install the cron job ──
          # The command discovers the log path at runtime (no API lookup needed).
          # It tries the common cPanel SSL log path, falls back to a glob.
          # Runs at 3:30am server time daily.
          CRON_CMD="LOG=\$(ls /home/pmax/logs/pmax.online-ssl_log 2>/dev/null || ls /home/pmax/logs/*ssl_log 2>/dev/null | head -1); [ -n \"\$LOG\" ] && gzip -c \"\$LOG\" | curl -s -X POST '${CJ_LOG_URL}' -F 'file=@-;filename=access.log.gz;type=application/gzip' > /dev/null 2>&1"

          echo "Installing cron command:"
          echo "  ${CRON_CMD}"
          echo ""

          RESULT=$(curl -s --max-time 30 \
            -H "Authorization: ${AUTH}" \
            -G \
            --data-urlencode "command=${CRON_CMD}" \
            --data-urlencode "minute=30" \
            --data-urlencode "hour=3" \
            --data-urlencode "day=*" \
            --data-urlencode "month=*" \
            --data-urlencode "weekday=*" \
            "${CPANEL}/execute/CronJobs/add_line")

          echo "CronJobs API response:"
          echo "${RESULT}"
          echo ""

          STATUS=$(echo "${RESULT}" | python3 -c "
          import json, sys
          try:
              d = json.loads(sys.stdin.read())
              print(d.get('status', 0))
          except:
              print(0)
          ")

          if [ "${STATUS}" != "1" ]; then
            echo "::error::Cron install failed — see API response above"
            exit 1
          fi

          echo "✓ Cron installed. Server will upload logs to crunchjunkie daily at 3:30am."
          echo ""

          # ── 2. List all cron jobs to confirm ──
          echo "Current cron jobs on server:"
          curl -s --max-time 30 \
            -H "Authorization: ${AUTH}" \
            "${CPANEL}/execute/CronJobs/list_lines" | \
            python3 -c "
          import json, sys
          try:
              data = json.loads(sys.stdin.read())
              jobs = data.get('data', {}).get('lines', [])
              if not jobs:
                  print('  (none found)')
              for job in jobs:
                  print(f\"  {job.get('minute')} {job.get('hour')} * * *  {job.get('command')}\")
          except Exception as e:
              print(f'  Error reading list: {e}')
          "
