name: Test crunchjunkie log upload (one-off)

# Deploys a temporary PHP script to the server, runs the log upload,
# shows the result, then deletes the script. Run once manually.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Deploy test script, run upload, clean up
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CJ_LOG_URL: ${{ secrets.CRUNCHJUNKIE_LOG_URL }}
        run: |
          CPANEL="https://rs00011.dp.smartservers.com.au:2083"
          AUTH="cpanel pmax:${CPANEL_API_TOKEN}"
          SCRIPT_NAME="cj-test-${{ github.run_id }}.php"
          SCRIPT_URL="https://pmax.online/${SCRIPT_NAME}"

          # ── 1. Write PHP test script to public_html ──
          PHP=$(cat << PHPEOF
          <?php
          header('Content-Type: text/plain');
          \$log = null;
          foreach (['/home/pmax/logs/pmax.online-ssl_log', '/home/pmax/logs/pmax.online-access_log'] as \$c) {
              if (@file_exists(\$c) && @is_readable(\$c)) { \$log = \$c; break; }
          }
          if (!\$log) {
              \$found = @glob('/home/pmax/logs/*ssl_log') ?: @glob('/home/pmax/logs/*log');
              if (\$found) \$log = \$found[0];
          }
          if (!\$log) {
              echo "ERROR: No log file found\n";
              echo "Contents of /home/pmax/logs/:\n";
              foreach (@scandir('/home/pmax/logs/') ?: [] as \$f) echo "  \$f\n";
              exit(1);
          }
          echo "Log: \$log\n";
          echo "Size: " . number_format(@filesize(\$log)) . " bytes\n";
          \$tmpgz = sys_get_temp_dir() . '/cjtest.gz';
          exec('gzip -c ' . escapeshellarg(\$log) . ' > ' . escapeshellarg(\$tmpgz), \$out, \$rc);
          if (\$rc !== 0 || !file_exists(\$tmpgz)) { echo "ERROR: gzip failed (rc=\$rc)\n"; exit(1); }
          echo "Gzipped: " . number_format(filesize(\$tmpgz)) . " bytes\n";
          \$url = getenv('CJ_LOG_URL') ?: '${CJ_LOG_URL}';
          \$ch = curl_init(\$url);
          curl_setopt_array(\$ch, [
              CURLOPT_POST => true,
              CURLOPT_POSTFIELDS => ['file' => curl_file_create(\$tmpgz, 'application/gzip', 'access.log.gz')],
              CURLOPT_RETURNTRANSFER => true,
              CURLOPT_TIMEOUT => 60,
          ]);
          \$resp = curl_exec(\$ch);
          \$code = curl_getinfo(\$ch, CURLINFO_HTTP_CODE);
          \$err  = curl_error(\$ch);
          curl_close(\$ch);
          @unlink(\$tmpgz);
          echo "HTTP: \$code\n";
          echo \$err ? "Curl error: \$err\n" : "Response: \$resp\n";
          PHPEOF
          )

          # Encode for cPanel save_file_content API
          ENCODED=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$PHP")

          curl -s --max-time 30 \
            -H "Authorization: ${AUTH}" \
            -G \
            --data-urlencode "dir=/home/pmax/public_html" \
            --data-urlencode "file=${SCRIPT_NAME}" \
            --data-urlencode "content=${PHP}" \
            "${CPANEL}/execute/Fileman/save_file_content" > /dev/null

          echo "Script deployed: ${SCRIPT_URL}"
          sleep 3

          # ── 2. Call the script and show output ──
          echo ""
          echo "── crunchjunkie upload test ──"
          curl -s --max-time 90 "${SCRIPT_URL}"
          echo ""

          # ── 3. Delete the test script ──
          curl -s --max-time 15 \
            -H "Authorization: ${AUTH}" \
            -G \
            --data-urlencode "dir=/home/pmax/public_html" \
            --data-urlencode "files-0=${SCRIPT_NAME}" \
            "${CPANEL}/execute/Fileman/delete_files" > /dev/null

          echo "Script removed."
